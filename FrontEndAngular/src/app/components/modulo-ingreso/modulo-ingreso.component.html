<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        
        <!-- Cabecera con tono Azul Marino -->
        <div class="card-header bg-navy text-white p-4">
          <div class="d-flex align-items-center">
            <div class="icon-box bg-white text-navy rounded-3 p-3 me-3 shadow-sm">
              <i class="bi bi-capsule-pill fs-3"></i>
            </div>
            <div>
              <h3 class="mb-1 fw-bold">Módulo de Ingreso</h3>
              <p class="mb-0 text-white-50">Registro y Trazabilidad de Lotes de Medicamentos (Público / Privado)</p>
            </div>
          </div>
        </div>
        
        <div class="card-body p-4 p-md-5 bg-light-custom">
          
          <!-- Mensajes de Alerta / Éxito globales del Servicio -->
          @if (omniService.mensajeExito()) {
            <div class="alert alert-success alert-dismissible fade show shadow-sm rounded-3 mb-4" role="alert">
              <i class="bi bi-check-circle-fill me-2"></i> {{ omniService.mensajeExito() }}
              <button type="button" class="btn-close" (click)="omniService.limpiarMensajes()"></button>
            </div>
          }

          @if (omniService.mensajeError()) {
            <div class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3 mb-4" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ omniService.mensajeError() }}
              <button type="button" class="btn-close" (click)="omniService.limpiarMensajes()"></button>
            </div>
          }

          <!-- Formulario de Ingreso -->
          <form [formGroup]="ingresoForm" (ngSubmit)="registrarLote()">
            <div class="row g-4">
              
              <!-- Nombre del Medicamento -->
              <div class="col-md-6">
                <label class="form-label fw-semibold text-secondary">Nombre del Medicamento / Presentación</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0"><i class="bi bi-box-seam text-muted"></i></span>
                  <input type="text" class="form-control border-start-0 ps-0" formControlName="nombre" placeholder="Ej. Ibuprofena 600mg (Tabletas)">
                </div>
              </div>

              <!-- Registro Sanitario -->
              <div class="col-md-6">
                <label class="form-label fw-semibold text-secondary">Registro Sanitario (DRCPFA)</label>
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                  <input type="text" class="form-control border-start-0 ps-0" formControlName="registroSanitario" placeholder="Ej. PF-12345-2026">
                </div>
              </div>

              <!-- Lote -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary">Número de Lote</label>
                <input type="text" class="form-control" formControlName="lote" placeholder="Ej. LOTE-X99">
              </div>

              <!-- Fecha de Vencimiento -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary">Fecha de Vencimiento</label>
                <input type="date" class="form-control" formControlName="fechaVencimiento">
              </div>

              <!-- Cantidad -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary">Cantidad de Unidades</label>
                <input type="number" class="form-control" formControlName="cantidad" min="1">
              </div>

              <!-- Precio Unitario -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary">Precio Unitario (Q)</label>
                <input type="number" step="0.01" class="form-control" formControlName="precioUnitario" min="0.01">
              </div>

              <!-- Temperatura / Cadena de Frío -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary">Condición / Temperatura</label>
                <input type="text" class="form-control" formControlName="temperatura" placeholder="Ej. 2°C - 8°C (Sensible)">
              </div>

              <!-- Institución Destino -->
              <div class="col-md-4">
                <label class="form-label fw-semibold text-secondary">Institución Destino</label>
                <select class="form-select" formControlName="destino">
                  @for (dest of institucionesDestino; track dest) {
                    <option [value]="dest">{{ dest }}</option>
                  }
                </select>
              </div>

              <!-- Departamento Destino -->
              <div class="col-md-12">
                <label class="form-label fw-semibold text-secondary">Departamento Destino</label>
                <select class="form-select" formControlName="departamentoDestino">
                  @for (dept of departamentosGuatemala; track dept) {
                    <option [value]="dept">{{ dept }}</option>
                  }
                </select>
              </div>

              <!-- Botón de Envío -->
              <div class="col-12 text-end mt-4 pt-3 border-top">
                <button type="submit" class="btn btn-navy-action px-5 py-2.5 fw-bold shadow-sm" [disabled]="ingresoForm.invalid">
                  <i class="bi bi-plus-circle me-2"></i> Registrar Lote en el Sistema
                </button>
              </div>

            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
